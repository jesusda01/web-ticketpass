<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketPass - Detalle del Evento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="btn-back">← Volver al catálogo</a>
        <h1>TicketPass</h1>
    </header>

    <main class="container">
        <div id="detalle-evento" class="detalle-card">
            <p>Cargando información del evento...</p>
        </div>
    </main>

    <!-- Modal de confirmación de compra -->
    <div id="modal-confirmacion" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span class="icon-success">✓</span>
                <h2>¡Compra Exitosa!</h2>
            </div>
            <div class="modal-body">
                <p>Tu entrada ha sido generada correctamente.</p>
                <div class="ticket-box">
                    <p><strong>Código de Ticket:</strong> <span id="modal-codigo">-</span></p>
                    <p><strong>Monto Total:</strong> S/ <span id="modal-monto">0.00</span></p>
                </div>
                <p class="small-text">Hemos enviado los detalles de tu compra a tu correo electrónico.</p>
            </div>
            <div class="modal-footer">
                <button onclick="cerrarModalEIrAInicio()" class="btn-modal">Aceptar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
